# ── Marketing site: wyvstudio.com (root domain) ─────────────────────────────
# Resolve the marketing upstream at request time (Docker's embedded DNS) via a
# variable in proxy_pass — same pattern as the docs block below. A static
# `proxy_pass http://marketing:80` caches the container IP at startup, so when
# the marketing/docs containers were restarted on deploy they swapped IPs and
# nginx ended up proxying wyvstudio.com to the docs container. Re-resolving per
# request makes routing immune to container restarts / IP changes.
server {
    listen 80;
    server_name wyvstudio.com www.wyvstudio.com;

    resolver 127.0.0.11 valid=30s;
    set $marketing_upstream marketing;

    location / {
        proxy_pass http://$marketing_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Docs / knowledgebase: docs.wyvstudio.com ────────────────────────────────
# Matched before the catch-all below so docs requests don't fall through to the
# app (which bounces logged-out visitors to /login). Upstream is resolved at
# request time via Docker's embedded DNS + a variable in proxy_pass, so a docs
# outage returns 502 for docs only — it never blocks nginx from starting.
server {
    listen 80;
    server_name docs.wyvstudio.com;

    resolver 127.0.0.11 valid=30s;
    set $docs_upstream docs;

    location / {
        proxy_pass http://$docs_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── App: app.wyvstudio.com + catch-all ──────────────────────────────────────
server {
    listen 80 default_server;
    server_name app.wyvstudio.com _;

    # Upstreams resolved per request via Docker's embedded DNS, so a recreated
    # api or reverb container is found without an nginx restart. Same pattern
    # as the docs/marketing blocks above; the /mcp location has its own.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream api;
    set $reverb_upstream reverb;

    # Vue SPA
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed assets forever, everything else no-cache
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media asset streaming (signed URLs, web route not under /api/).
    # FastCGI to php-fpm; buffering off so large media streams through
    # instead of being spooled to a temp file first.
    location /media/ {
        include /etc/nginx/fastcgi-api.conf;
        fastcgi_buffering off;
        client_max_body_size 100M;
    }

    # API — FastCGI to php-fpm (real concurrency; replaces single-threaded
    # `artisan serve`, which serialized every request).
    location /api/ {
        include /etc/nginx/fastcgi-api.conf;
        client_max_body_size 100M;
    }

    # OAuth discovery for MCP connectors. The authorization-server document
    # is Laravel's; the protected-resource document is the MCP sidecar's.
    location = /.well-known/oauth-authorization-server {
        include /etc/nginx/fastcgi-api.conf;
    }
    location ^~ /.well-known/oauth-protected-resource {
        resolver 127.0.0.11 valid=30s;
        set $mcp_meta_upstream mcp;
        proxy_pass http://$mcp_meta_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # MCP server (Node sidecar). Streamable HTTP: responses may be SSE, so
    # no buffering and generous timeouts. Upstream resolved at request time
    # like docs/marketing so an mcp outage never blocks nginx from starting.
    location = /mcp {
        resolver 127.0.0.11 valid=30s;
        set $mcp_upstream mcp;
        proxy_pass http://$mcp_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1M;
    }

    # Reverb WebSocket
    location /app/ {
        proxy_pass http://$reverb_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Reverb broadcasting auth (also used by WebSocket client) — Laravel route.
    location /broadcasting/ {
        include /etc/nginx/fastcgi-api.conf;
    }

    # Public share pages — server-rendered by Laravel so link scrapers and
    # search engines get real OG/VideoObject markup instead of the SPA's
    # empty index.html. Humans get the same fast page with hover-to-play.
    location /sample/ {
        include /etc/nginx/fastcgi-api.conf;
    }

    # SPA fallback.
    #
    # No $uri/ here on purpose. The built bundle lives in /assets, and /assets
    # is also a route in the app (the Asset Library) — so $uri/ matched the real
    # directory and nginx answered a refresh or a pasted link with 301 then 403
    # instead of loading the app. Files still resolve through $uri; anything
    # that is not a file is the router's problem, which is the whole point of a
    # fallback.
    location / {
        try_files $uri /index.html;
    }
}
