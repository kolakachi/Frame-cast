# Standalone local proof only. Never merges into the production stack.
name: wyv-hyperframes-proof
services:
  smoke:
    build: .
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    # Six clips decoded at once beside Chromium hold about 2.4 GB that cannot be freed (gauntlet, 2026-10-05);
    # 4 GB keeps that under 60%. Docker on this machine has 11.9 GB and runs one render at a time.
    mem_limit: 4g
    # Six parallel ffmpeg extractions on a machine reporting 10 cores need hundreds of threads beside Chromium;
    # at 256 new threads failed and the render hung or errored (2026-10-05).
    pids_limit: 2048
    shm_size: 256m
    tmpfs:
      - /tmp:size=4294967296,mode=1777
    volumes:
      - ./artifacts:/output
      # Native Linux locks; macOS bind-mounted files do not reliably preserve
      # exclusion when a waiting process is cancelled.
      - sandbox-lock:/sandbox-lock
volumes:
  sandbox-lock:
