</style></head><body><main id="main" data-composition-id="main" data-width="1280" data-height="720" data-duration="6">

</main><script>
const tl=gsap.timeline({paused:true});
window.rig=WyvMascot.attach(tl,document.querySelector('#mascot'),{
duration:6,blinks:[{at:.8,duration:.24},{at:4.8,duration:.22}],
head:[{at:1.6,duration:.4,x:0,y:-3,tilt:-6},{at:3.2,duration:.5,x:0,y:0,tilt:0}],
gaze:[{at:1.6,duration:.2,x:-5,y:0},{at:3.2,duration:.2,x:0,y:0}],
mouths:[{at:1.6,shape:'round'},{at:2.6,shape:'smile'},{at:4.2,shape:'open'},{at:5.2,shape:'rest'}]
});
// Keep the outer mascot stationary: the proof must show internal performance.
tl.set('#cue',{textContent:'Blink'},.8).set('#cue',{textContent:'Curious glance'},1.6).set('#cue',{textContent:'Smile'},2.6).set('#cue',{textContent:'Surprise'},4.2).set('#cue',{textContent:'Neutral'},5.2);
window.__timelines=window.__timelines||{};window.__timelines.main=tl;
</script></body></html>
