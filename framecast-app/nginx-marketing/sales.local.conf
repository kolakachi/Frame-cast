# Local preview of sales.wyvstudio.com (docker-compose.yml `sales`, http://localhost:8091). Mirrors the sales server
# block in default.conf, without the API proxy.
server {
    listen 80 default_server;
    root /usr/share/nginx/sales;
    index index.html;
    add_header Cache-Control "no-store" always;

    error_page 404 /404.html;
    location = /404.html { root /usr/share/nginx/html; internal; }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?|mp4|txt|xml)$ {
        try_files $uri @shared;
    }
    location @shared {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ~ ^/(terms|privacy|refund|acceptable-use|synthetic-media|ai-safety|copyright|data-deletion|help)$ {
        root /usr/share/nginx/html;
        try_files $uri.html =404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
