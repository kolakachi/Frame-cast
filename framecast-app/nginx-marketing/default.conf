# ── special.wyvstudio.com: the Launchpad funnel (FE, upgrades, thank-you) ──
# Its own pages from launchpad/ (mounted at /usr/share/nginx/launchpad), never inside the main site's files: the
# launch prices and Launchpad's retailer wording must not exist on wyvstudio.com. Not indexed. Shared static assets
# (styles.css, favicon, posthog-init.js, cookie-notice.js, brand images) come from the main site's files.
server {
    listen 80;
    server_name special.wyvstudio.com;

    root /usr/share/nginx/launchpad;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 1024;

    error_page 404 /404.html;
    location = /404.html { root /usr/share/nginx/html; internal; }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?|mp4)$ {
        try_files $uri @shared;
    }
    location @shared {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# ── sales.wyvstudio.com: our own sales page (the $69 one-time offer; owner, 2026-10-13) ─────────────
# Its own page from sales/ (mounted at /usr/share/nginx/sales). Shared assets and the legal pages (Kelviq is the
# merchant here, as on the main site) come from the main site's files. Never the default server: see below.
server {
    listen 80;
    server_name sales.wyvstudio.com;

    root /usr/share/nginx/sales;
    index index.html;
    add_header X-Robots-Tag "noindex" always;

    resolver 127.0.0.11 valid=30s;
    set $api_upstream api;

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 1024;

    error_page 404 /404.html;
    location = /404.html { root /usr/share/nginx/html; internal; }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?|mp4|txt|xml)$ {
        try_files $uri @shared;
    }
    location @shared {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ~ ^/(terms|privacy|refund|acceptable-use|synthetic-media|ai-safety|copyright|data-deletion|help)$ {
        root /usr/share/nginx/html;
        try_files $uri.html =404;
    }
    location = /api/v1/affiliate/click {
        include /etc/nginx/fastcgi-api.conf;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# The main site is the default: any host other than the funnel's lands here. ("server_name _" alone is not a catch-all;
# without default_server the first block above took every host, and wyvstudio.com served the funnel, 2026-10-13.)
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The shared fastcgi include expects $api_upstream (resolved per request).
    resolver 127.0.0.11 valid=30s;
    set $api_upstream api;

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 1024;

    # Branded 404 for unknown paths (served with a 404 status).
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Clean URLs: /terms → terms.html, /privacy → privacy.html
    location = /terms          { try_files /terms.html =404; }
    location = /privacy        { try_files /privacy.html =404; }
    location = /refund         { try_files /refund.html =404; }
    location = /data-deletion  { try_files /data-deletion.html =404; }
    location = /help           { try_files /help.html =404; }
    location = /changelog      { try_files /changelog.html =404; }
    location = /logo           { try_files /logo-export.html =404; }
    # JVZoo launch pages. Kept off the main marketing surface on purpose: the
    # JVZoo disclaimer names JVZoo as the retailer, which contradicts the
    # Kelviq merchant-of-record disclosure on /terms, /privacy and /refund.
    location = /starter        { try_files /starter.html =404; }
    location = /ty             { try_files /ty.html =404; }
    location = /robots.txt     { try_files /robots.txt =404; }
    location = /sitemap.xml    { try_files /sitemap.xml =404; }

    # Same-origin proxy for the public changelog feed. The changelog page is
    # served from wyvstudio.com but the API lives on app.wyvstudio.com, and
    # CORS there is scoped to the app origin with supports_credentials=true.
    # Proxying keeps the fetch same-origin instead of widening credentialed
    # CORS to the marketing domain for one public, read-only endpoint.
    location = /api/v1/public/changelog {
        include /etc/nginx/fastcgi-api.conf;
    }

    # Record referral arrivals on the marketing origin, without widening CORS.
    location = /api/v1/affiliate/click {
        include /etc/nginx/fastcgi-api.conf;
    }

    # Real static pages resolve via $uri/$uri.html; anything else 404s
    # (was falling back to /index.html, which silently served the homepage).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
