# Local preview of special.wyvstudio.com (docker-compose.yml `launchpad`, http://localhost:8090). Mirrors the
# launchpad server block in default.conf: the funnel's pages, with shared assets from the main site's files.
server {
    listen 80 default_server;
    root /usr/share/nginx/launchpad;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    error_page 404 /404.html;
    location = /404.html { root /usr/share/nginx/html; internal; }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?|mp4)$ {
        try_files $uri @shared;
    }
    location @shared {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
