<!DOCTYPE html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"City","default":"Lisbon"},{"id":"line_1","type":"string","label":"Condition","default":"Mostly sunny"},{"id":"line_2","type":"string","label":"Alert","default":"Rain starts in 20 minutes"},{"id":"line_3","type":"string","label":"Brand","default":"Skye"},{"id":"cta","type":"string","label":"Call to action","default":"Free on iOS and Android"},{"id":"color_background","type":"color","label":"Field","default":"#141A4A"},{"id":"color_accent","type":"color","label":"Accent","default":"#7CC4FF"},{"id":"color_text","type":"color","label":"Text","default":"#FFFFFF"}]'>
<head>

<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="15">

      <div class="temp"><span id="deg">21</span>°</div>
      <div class="range">H 24° · L 15°</div>
    </div>

    <div class="glass card-hours" id="hours">

    <div class="glass close" id="close"><span class="brand" id="brand">Skye</span><span class="cta" id="cta">Free on iOS and Android</span></div>
  </div>
</div>
