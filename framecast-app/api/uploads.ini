upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 256M
; The final look sends up to 40 frames in one request (fair credits 1.5, 2026-10-20: the default 20 cut it off).
max_file_uploads = 50
; Errors go to the log, never into an API reply (a warning page broke the worker's JSON).
display_errors = Off
log_errors = On
