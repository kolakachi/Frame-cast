server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static files (images, fonts, scripts): return a real 404 if missing —
    # never the HTML 404 page. Otherwise a request for an asset that doesn't
    # exist yet (e.g. mid-deploy) gets a 200 HTML body, which a CDN then caches
    # against the asset URL and serves as the "image" forever.
    location ~* \.(svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|eot|js|mjs|css|map|json|txt|xml|mp4|webm)$ {
        try_files $uri =404;
    }

    # The API section's index is the generated category page. /api is the
    # short address printed in the app, the OAuth metadata and the homepage;
    # the bare folder path is what people guess. Both lead there.
    location = /api { return 301 /category/api--ai-assistants; }
    location = /api/ { return 301 /category/api--ai-assistants; }
    location = /api-and-connectors { return 301 /category/api--ai-assistants; }
    location = /api-and-connectors/ { return 301 /category/api--ai-assistants; }

    # Docusaurus emits a directory per route (/path/index.html) — resolve those,
    # fall back to the generated 404 page WITH a 404 status, so a missing page
    # is not cached or indexed as a real one.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache the fingerprinted assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
