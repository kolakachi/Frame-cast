<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a lab-bench ledger: progress summary on top, one filterable ledger of findings below. */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #18212b; --muted: #5d6b79; --rule: #dde3e9; --grid: #e9edf1; --accent: #0f6c7c;
  --done: #1f7a4d; --done-bg: #e3f3ea; --next: #1f5fbf; --next-bg: #e5eefb; --open: #8a5a00; --open-bg: #fbf0d9;
  --check: #6b3fb3; --check-bg: #efe8fb; --idea: #56636f; --idea-bg: #edf0f3;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --panel: #151d25; --ink: #e4eaf0; --muted: #94a3b1; --rule: #26313c; --grid: #19222b; --accent: #4fb3c4;
  --done: #6fd39f; --done-bg: #12301f; --next: #8db8ff; --next-bg: #15253f; --open: #f0c060; --open-bg: #33270d;
  --check: #c4a6ff; --check-bg: #261b3d; --idea: #a9b5c0; --idea-bg: #1d262f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151b; --panel: #151d25; --ink: #e4eaf0; --muted: #94a3b1; --rule: #26313c; --grid: #19222b; --accent: #4fb3c4;
  --done: #6fd39f; --done-bg: #12301f; --next: #8db8ff; --next-bg: #15253f; --open: #f0c060; --open-bg: #33270d;
  --check: #c4a6ff; --check-bg: #261b3d; --idea: #a9b5c0; --idea-bg: #1d262f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding-inline: 16px; padding-block: 28px 48px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px }
header { display: grid; gap: 6px }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
h1 { font: 700 34px/1.1 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance }
.lede { margin: 0; color: var(--muted); max-width: 64ch }
.summary { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--idea-bg) }
.bar span { display: block; height: 100% }
.counts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-variant-numeric: tabular-nums }
.counts b { font: 600 20px/1 var(--display); margin-right: 4px }
.counts span { color: var(--muted); font-size: 13px }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font: 500 13px/1 var(--body); border: 1px solid var(--rule); background: var(--panel); color: var(--ink); padding: 7px 11px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--bg) }
.chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.sep { width: 1px; height: 22px; background: var(--rule) }
input[type=search] { flex: 1 1 220px; min-width: 0; font: 14px var(--body); padding: 8px 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink) }
.ledger { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.row { display: grid; grid-template-columns: 72px 86px minmax(0, 1fr) 84px; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--rule); align-items: start }
.row:first-child { border-top: 0 }
.row.head { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: 10px; background: var(--bg) }
.id { font: 500 13px/1.6 var(--mono); color: var(--muted) }
.area { font-size: 13px; color: var(--muted); line-height: 1.6 }
.what { min-width: 0 } .what p { margin: 0 } .meta { margin-top: 3px; font-size: 13px; color: var(--muted) }
.pill { justify-self: start; font: 600 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; white-space: nowrap }
.s-done { color: var(--done); background: var(--done-bg) } .s-next { color: var(--next); background: var(--next-bg) } .s-open { color: var(--open); background: var(--open-bg) }
.s-check { color: var(--check); background: var(--check-bg) } .s-idea { color: var(--idea); background: var(--idea-bg) } .s-skipped { color: var(--idea); background: var(--idea-bg); text-decoration: line-through }
.empty { padding: 24px 16px; color: var(--muted) }
footer { color: var(--muted); font-size: 13px }
@media (max-width: 640px) { .row { grid-template-columns: 1fr auto; gap: 6px 12px } .row.head { display: none } .area { order: 3; grid-column: 1 / -1 } .what { grid-column: 1 / -1; order: 4 } .id { order: 1 } .pill { order: 2; justify-self: end } h1 { font-size: 28px } }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width .4s ease } }
</style>

<div class="wrap">

    <span class="eyebrow">Research to product</span>
    <h1>WyvStudio R&amp;D</h1>
    <p class="lede">Everything we found while researching and decided to take, in one ledger. Items move from idea to done as they are built; ideas need a yes or a no.</p>

  <footer>Updated 2026-10-16 · source: <span style="font-family:var(--mono)">docs/R&amp;D/items.py</span></footer>
</div>

<script>
const ITEMS = [{"id": "RD-43", "area": "Platform", "item": "My Footage Tighten: retake and false-start detection, phrase-safe filler cuts, pauses that keep a breath", "src": "herk-edit-kit", "status": "idea", "note": "From the RD-33 review; ideas only, our own code."}, {"id": "RD-44", "area": "Create", "item": "Stutter and freeze check on the finished file: unique fps, worst hitch, frozen tail; frame 0 opens on content", "src": "designer-stack", "status": "idea", "note": "From the designer-stack review; S."}, {"id": "RD-45", "area": "Create", "item": "Hook and copy cliche lint: Introducing, Unlock the power of, Game changer, placeholder names", "src": "designer-stack", "status": "idea", "note": "From the designer-stack review; S."}, {"id": "RD-46", "area": "Create", "item": "Design-tool selection move: selection box with handles, a WxH label, a cursor click", "src": "designer-stack", "status": "idea", "note": "From the designer-stack review; M."}, {"id": "RD-01", "area": "UGC", "item": "A shot blocked by moderation is rewritten more neutrally and retried once, instead of failing", "src": "Pixelle-Video", "status": "done", "note": "2026-10-15: a declined clip is reworded in neutral words (UgcPromptSoften) and made once more; a second decline fails uncharged."}, {"id": "RD-02", "area": "UGC", "item": "Character mix-up check: each skit clip shows the right speaker", "src": "Jellyfish", "status": "done", "note": "2026-10-15: skit clips are face-checked against their own speaker; a clip closer to the other speaker is recorded as a mix-up and counts as a miss (remade when face remakes are on)."}, {"id": "RD-03", "area": "UGC", "item": "Cast sheet: every person, place and prop gets a reference and shots name them (@name); a ready check before any paid shot", "src": "Toonflow, huobao", "status": "done", "note": "2026-10-15: a skit's cast sheet is made before any paid clip (every speaker's photo read, each dressed once; an unreadable photo stops the take with nothing bought), recorded on the take as cast_sheet; each clip's prompt opens with a cast line naming its speaker (@Name) and which reference image is the person, the product and the room."}, {"id": "RD-05", "area": "Create", "item": "Builder rules in the prompt: HyperFrames effects that break renders, and the craft rules from the motion briefs", "src": "product-launch-motion, student-kit, skills/", "status": "done", "note": "2026-10-15: craft.md already had the traps, one camera, hand-offs and label swaps; added deterministic frames and fonts-before-measuring."}, {"id": "RD-06", "area": "Create", "item": "Motion vocabulary by scene purpose (386 unused blocks), a no-slideshow check and a plan lint", "src": "awesome-ai-motion, huashu, cinetic", "status": "done", "note": "2026-10-15: the no-slideshow check (reads-check, blocks delivery), the 47 moves and the registry shortlist already existed; added the purpose guide (which moves for a hook, a number, a list, a screen, a reveal...) with a variety rule, and the storyboard rules (no bare-text ending, no empty gradient, no floating number) to the planner."}, {"id": "RD-07", "area": "Create", "item": "Finishing checks: constant-speed motion, repeated technique, text under phone UI, cues present, voice over music, contact sheet", "src": "animate, claude-motion-design", "status": "done", "note": "2026-10-15: safe zones, edge margins, overlap, one-frame pops, loudness, sound cues (placed by the sound pass) and the review contact sheet existed; added the repeated-technique and constant-speed checks (builder warnings) and raised voice over music from 6 to 9 dB."}, {"id": "RD-08", "area": "Create", "item": "True peak at or below -1 dBTP alongside -14 LUFS", "src": "Opus Motion Design Harness", "status": "done", "note": "2026-10-15: Create's delivery check already measured true peak (ebur128) and corrected to -1 dB; UGC takes now get the same standard (they were not levelled)."}, {"id": "RD-09", "area": "Create", "item": "Every cut has a carrier: a plan rule and a check", "src": "Opus Motion Design Harness", "status": "done", "note": "2026-10-15: transition_out (what becomes the next scene, with which move) and its move check existed; added the words it lands on, timed by the builder, and a plain cut set on any beat left without one."}, {"id": "RD-10", "area": "Create", "item": "Focus and letter type kit: blur-in text, letters rising, rack focus, glow flash", "src": "Gap report", "status": "done", "note": "2026-10-15: WM.blurIn, WM.letters, WM.rackFocus and WM.glow in the motion kit, named for the planner (blur_in, letters, rack_focus, glow) and in the purpose guide; glow brings a chime."}, {"id": "RD-11", "area": "Create", "item": "Explainer styles (whiteboard, kinetic type, finance chart) and a timing breakdown for 'make it like this'", "src": "huashu, student-kit", "status": "done", "note": "2026-10-15: kinetic type and data story (charts) already existed; added the Whiteboard explainer pack (marker strokes drawn on, handwriting, one board the camera travels, worked 15 s example checked frame by frame) and the reference's timing breakdown (each moment's share of the length, scaled to the new duration). Never marketed as a named channel's look."}, {"id": "RD-13", "area": "Create", "item": "Change requests answer every note with exactly what changed", "src": "Opus Motion Design Harness", "status": "done", "note": "2026-10-15: an edit's latest message is split into its notes (bullets, lines or sentences); with two or more, the finish summary ends with a titled list, one item per note (what changed or why not), shown as its own section in the chat; a short list is sent back once."}, {"id": "RD-14", "area": "Create", "item": "A defect the checks missed becomes a new check, approved once", "src": "Opus Motion Design Harness", "status": "done", "note": "2026-10-15: a message on a delivered Create video is read by one Haiku call (queued) for a fault the checks missed; a fault is recorded in create_missed_defects with a proposed general check. Approve with php artisan create:missed-defects --approve=ID (--check to reword); approved checks go to every build's visual reviewer as house checks. Off switch: CREATE_MISSED_DEFECTS=false."}, {"id": "RD-15", "area": "Create", "item": "Social-native kit: comments, like burst, stitch, chat, notes app, POV", "src": "Kit planning", "status": "done", "note": "2026-10-15: comments, chat, notes app, notifications, follow cards and highlighted captions were already registry items; added WM.heartBurst, WM.replySticker and WM.stitch (checked rendered), the POV caption pattern and feed safe zones in kit/social.md, pinned when a plan uses a social move or feed piece; a social-proof row in the purpose guide."}, {"id": "RD-16", "area": "Create", "item": "Product hero kit: 2.5D turn, floor reflection, spotlight, explode, before/after", "src": "Kit planning", "status": "done", "note": "2026-10-15: WM.floor (contact shadow + glossy reflection), WM.productTurn (2.5D turn with a sheen masked to the cutout), WM.spotlight (dark stage, light lands on the product, then lifts) and WM.explode (ingredients burst out to their labels), each checked rendered; before/after and a light sweep were already WM.split and registry items. kit/product.md, pinned when a plan uses these moves or buys a product cutout."}, {"id": "RD-19", "area": "Create", "item": "One shared style line and several variants per image prompt", "src": "Higgsfield KICKS demo", "status": "done", "note": "2026-10-15: the planner writes one image_style line (medium, lighting, lens, palette, finish) carried on the plan and added to every ai_image prompt; ai_image descriptions keep to subject and framing; a flicker montage is planned as 3-6 variant items of one prompt (priced per item as before)."}, {"id": "RD-24", "area": "Create", "item": "A small illustration set the builder can drop into a scene (was: a hand-licensed Lottie set)", "src": "lottie-web", "status": "done", "note": "2026-10-16: LottieFiles' site terms make free-plan files non-commercial and the commercial libraries sell icons we already have, so the set was drawn in code instead (owner: no designer). runtime/wyv-illos.js: 25 flat animated illustrations (shopping, messages, progress, everyday) in the brand palette, each checked rendered; the builder's guide and the planner list them."}, {"id": "RD-30", "area": "Money", "item": "A provider call never sent settles at zero; a closed run's held credits are released", "src": "Dan rebuild", "status": "done", "note": "2026-10-15: a call with no dispatch claim, prediction or response settles at zero; held credits were already released at clear states since 2026-10-10 (CreditHolds)."}, {"id": "RD-31", "area": "Platform", "item": "Trim old tool output in the build loop to cut cost", "src": "arXiv harness study", "status": "done", "note": "2026-10-15: old frames already left in batches, earlier writes shrank, and results shortened near the context cap; added a rule-based trim of stale output (a read of a file rewritten later, a check, timeline or preview a newer one replaced), run only in the same batch as the frame drop so it never forces an extra re-cache. Shortened characters are counted on the build state (trimmedChars)."}, {"id": "RD-33", "area": "Platform", "item": "Review herk-edit-kit and write down which parts to take", "src": "herk-edit-kit", "status": "done", "note": "2026-10-15: herk-edit-kit.md. Ideas only (most of the kit is under a use permission, not MIT); best value: retake detection, phrase-safe Tighten, breath-keeping pauses (RD-43)."}, {"id": "RD-34", "area": "Create", "item": "Collage kit and Collage / zine style", "src": "Higgsfield KICKS demo", "status": "done", "note": "2026-10-09"}, {"id": "RD-35", "area": "Create", "item": "Gap report: reference moments no move reproduces", "src": "Kit planning", "status": "done", "note": "create:move-gaps"}, {"id": "RD-36", "area": "Create", "item": "Kit guide split: core kit plus specialty kits per video", "src": "Kit planning", "status": "done", "note": ""}, {"id": "RD-37", "area": "Create", "item": "Single-frame glitch check on the finished video", "src": "claude-motion-design", "status": "done", "note": ""}, {"id": "RD-38", "area": "Create", "item": "Energy arc, easing by material, sound matches weight, still before a cut", "src": "klik, LottieFiles, product-launch-motion", "status": "done", "note": ""}, {"id": "RD-39", "area": "Create", "item": "Onboarding: three questions, site to brand kit, first brief ready", "src": "Higgsfield onboarding", "status": "done", "note": ""}, {"id": "RD-40", "area": "UGC", "item": "Outfits that hold: the presenter dressed once and that picture in every clip, skit speakers too", "src": "Jellyfish", "status": "done", "note": "2026-10-15"}, {"id": "RD-41", "area": "UGC", "item": "Skit speakers keep one side of the frame (180-degree rule)", "src": "OpenMontage", "status": "done", "note": "2026-10-15"}, {"id": "RD-04", "area": "UGC", "item": "Two-shot opener or Seedance multi-shot, if skit rooms still split", "src": "OpenMontage", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: the skit fixes (one shared room photo on every speaker, dressed once, same-room wording, screen direction) target the split-room problem directly; a two-shot opener or Seedance multi-shot costs more per take. Reopen only if a skit take still shows two rooms."}, {"id": "RD-12", "area": "Create", "item": "Taste rules A/B: frontend-design, canvas-design and taste-skill as defaults", "src": "Anthropic skills, taste-skill", "status": "skipped", "note": "2026-10-15 A/B (same plan, rules on vs off): with them the builder still put a styled accent word in every headline and clipped one line, at 318 vs 235 credits ($1.24 vs $0.92). Owner: we don't need taste. Card, reviewer checklist and switch removed; the design card's existing rules stay."}, {"id": "RD-17", "area": "Create", "item": "UI morph kit: blur hand-off, drawn chart with tooltip, palette, 60 fps option", "src": "UI motion study", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: a SaaS UI-morph kit serves software launch films; our lead customer is brand and marketing teams running paid social, and the screen moves we have (device, camera, cursor, press, morph, edges) cover product demos."}, {"id": "RD-18", "area": "Create", "item": "Data and infographic kit", "src": "Kit planning", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: not our customer's need yet; the data-story style, count, odometer, gauge and the registry's charts cover the numbers a social ad shows."}, {"id": "RD-20", "area": "Create", "item": "Spinning globe and 3D product-hero helpers", "src": "cobe, drei", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: the build worker has no GPU, so WebGL renders in software and slows every frame; a globe or 3D hero would be limited to a few beats. W3D.prop already models simple 3D objects, and the product kit (RD-16) covers the product hero from a photo."}, {"id": "RD-21", "area": "Create", "item": "Shader backgrounds ported to WebGL: gradient, aurora, glass, grain", "src": "shaders", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: these shaders are WebGPU-only and the worker has no GPU; porting them to WebGL would still render in software, slowly."}, {"id": "RD-22", "area": "Create", "item": "Original music written as code", "src": "Opus Motion Design Harness", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why (reason written down later, 2026-10-15): we already have generated music (MusicGen), a library and ducking under the voice; music written as code sounds thinner than a generated bed and nobody has asked for it."}, {"id": "RD-23", "area": "Create", "item": "Better beat and drop detection for the user's own music", "src": "claude-motion, animate", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why (reason written down later, 2026-10-15): beat-grid.mjs already finds the beat grid and the builder cuts on it; drop detection matters only for music-led edits of the user's own track, which briefs rarely ask for. Reopen if music-led edits become common."}, {"id": "RD-25", "area": "Create", "item": "Premium effect recipes: tab edges, bars to line, dock falloff, glass focus, particle logo", "src": "motion-graphics-skills", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why (reason written down later, 2026-10-15): mostly overlaps what we have: tab edges is WM.edges, bars to line is WM.morph, glass focus is WM.rackFocus (RD-10); the particle logo is a look craft.md avoids as 'generated'; dock falloff is a desktop-UI flourish our ads do not need."}, {"id": "RD-26", "area": "Create", "item": "Illustrated looks in code: riso print, cut paper", "src": "animate", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why (reason written down later, 2026-10-15): the collage kit already gives the print and paper looks (halftone, duotone, ink, silver grades; torn paper; die-cut stickers) and the Collage / zine style uses them."}, {"id": "RD-27", "area": "Create", "item": "Studio mode: a gate at every stage, for agencies", "src": "Opus Motion Design Harness", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: a gate at every stage is an agency workflow; agencies are a later push, and our customers want fewer approvals, not more."}, {"id": "RD-28", "area": "Create", "item": "Text behind the subject: cut out the person, type between layers", "src": "Barty object separation", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why (reason written down later, 2026-10-15): possible today without a new kit: the cutout_video media item cuts the person out of a clip and the builder layers type between the background and the cutout when a brief asks for it."}, {"id": "RD-29", "area": "Create", "item": "Math-style explainer shots", "src": "manimgx", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: manimgx is early and does not run on our ARM worker; watch it until it matures."}, {"id": "RD-32", "area": "Platform", "item": "Still-ad editor: logo and headline on a generated image, export 1.91:1 and 1:1", "src": "fabric.js", "status": "skipped", "note": "Skipped 2026-10-15 (owner). Why: a still-ad editor is a separate product (image ads), outside the video studio."}, {"id": "RD-42", "area": "Create", "item": "Taste rules written into the builder's doctrine", "src": "Anthropic skills, taste-skill", "status": "skipped", "note": "Dropped with RD-12 (owner, 2026-10-15)."}];
const ORDER = ["check", "next", "open", "idea", "done", "skipped"];
const LABEL = { check: "Check", next: "Next", open: "Open", idea: "Idea", done: "Done", skipped: "Skipped" };
const COLOR = { done: "var(--done)", next: "var(--next)", open: "var(--open)", check: "var(--check)", idea: "var(--idea)", skipped: "var(--rule)" };
const areas = [...new Set(ITEMS.map(i => i.area))];
const state = { status: "all", area: "all", q: "" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function counts() {
  const n = s => ITEMS.filter(i => i.status === s).length;
  document.getElementById("bar").innerHTML = ORDER.filter(n).map(s => `<span style="width:${(n(s) / ITEMS.length * 100).toFixed(2)}%;background:${COLOR[s]}" title="${LABEL[s]}: ${n(s)}"></span>`).join("");
  document.getElementById("bar").setAttribute("aria-label", ORDER.filter(n).map(s => `${LABEL[s]} ${n(s)}`).join(", "));
  document.getElementById("counts").innerHTML = ORDER.filter(n).map(s => `<div><b style="color:${COLOR[s]}">${n(s)}</b><span>${LABEL[s].toLowerCase()}</span></div>`).join("") + `<div><b>${ITEMS.length}</b><span>in total</span></div>`;
}
function chips(el, values, key, labels) {
  el.innerHTML = ["all", ...values].map(v => `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${state[key] === v}">${v === "all" ? "All" : esc(labels ? labels[v] : v)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return; state[key] = b.dataset.v; render(); };
}
function render() {
  chips(document.getElementById("statusChips"), ORDER.filter(s => ITEMS.some(i => i.status === s)), "status", LABEL);
  chips(document.getElementById("areaChips"), areas, "area");
  const q = state.q.toLowerCase();
  const rows = ITEMS.filter(i => (state.status === "all" || i.status === state.status) && (state.area === "all" || i.area === state.area)
    && (!q || (i.item + " " + i.src + " " + i.note + " " + i.id).toLowerCase().includes(q)));
  document.getElementById("ledger").innerHTML = `<div class="row head"><span>ID</span><span>Area</span><span>Item</span><span>Status</span></div>`
    + (rows.length ? rows.map(i => `<div class="row"><span class="id">${esc(i.id)}</span><span class="area">${esc(i.area)}</span>
      <div class="what"><p>${esc(i.item)}</p><div class="meta">From ${esc(i.src)}${i.note ? " · " + esc(i.note) : ""}</div></div>
      <span class="pill s-${i.status}">${LABEL[i.status]}</span></div>`).join("") : `<div class="empty">Nothing matches. Clear the filters to see every item.</div>`);
}
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
counts(); render();
</script>
