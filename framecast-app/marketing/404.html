<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Page not found · WyvStudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: rgba(20, 20, 28, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ececf3;
            --text-dim: #8b8b9a;
            --accent: #ff6b35;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 107, 53, 0.10), transparent 45%),
                var(--bg);
            color: var(--text);
            font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 56px;
        }

        .logo-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .logo-text b { color: var(--accent); font-weight: 700; }

        .code {
            font-family: "Space Mono", monospace;
            font-size: clamp(96px, 22vw, 168px);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: var(--accent);
            text-shadow: 0 12px 60px rgba(255, 107, 53, 0.35);
        }

        h1 {
            font-size: clamp(22px, 5vw, 30px);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 28px;
            text-wrap: balance;
        }

        p {
            color: var(--text-dim);
            font-size: 16px;
            line-height: 1.6;
            margin-top: 14px;
            max-width: 30rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 36px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #ff7a47; transform: translateY(-1px); }

        .btn-ghost { color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
            .btn:hover { transform: none; }
        }
    </style>
</head>
<body>
    <a href="/" class="logo" aria-label="WyvStudio home">
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#ff6b35" />
            <path d="M14 18 L22 46 L32 28 L42 46 L50 18" stroke="white" stroke-width="4.5"
                stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <path d="M27 37 Q32 28 37 37" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"
                stroke-linecap="round" fill="none" />
        </svg>
        <span class="logo-text"><b>Wyv</b>Studio</span>
    </a>

    <div class="code">404</div>
    <h1>This page didn't make the final cut.</h1>
    <p>The link is broken or the page has moved — but your next video is still one click away.</p>

    <div class="actions">
        <a href="/" class="btn btn-primary">Back to home</a>
        <a href="https://app.wyvstudio.com" class="btn btn-ghost">Open the app</a>
    </div>
</body>
</html>
