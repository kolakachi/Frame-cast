<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WyvStudio Changelog</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="theme-color" content="#ff6b35" />
<meta name="description" content="What's new in WyvStudio — new features, improvements, and fixes, with dates. See what we shipped and when.">
<meta property="og:title" content="Changelog — WyvStudio" />
<meta property="og:description" content="New features, improvements, and fixes — with dates." />
<meta property="og:type" content="article" />
<meta property="og:url" content="https://wyvstudio.com/changelog" />
<meta property="og:image" content="https://s3.us-east-005.backblazeb2.com/frame-cast/marketing/og/og-default-v1.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://s3.us-east-005.backblazeb2.com/frame-cast/marketing/og/og-default-v1.jpg" />
<link rel="canonical" href="https://wyvstudio.com/changelog" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#14141c;--border:#25252f;--text:#ececf3;--text-dim:#8b8b9a;--accent:#ff6b35}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.7}
nav{padding:0 32px;height:60px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,.9);backdrop-filter:blur(12px);z-index:10}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo span{font-size:15px;font-weight:700;color:var(--text)}
.nav-logo span em{color:var(--accent);font-style:normal}
.container{max-width:720px;margin:0 auto;padding:64px 24px 120px}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
.meta{font-size:13px;color:var(--text-dim);margin-bottom:48px;padding-bottom:24px;border-bottom:1px solid var(--border)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.entry{padding:24px 0;border-bottom:1px solid var(--border)}
.entry:last-of-type{border-bottom:none}
.entry-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.tag.new{background:rgba(52,211,153,.15);color:#34d399}
.tag.improved{background:rgba(96,165,250,.15);color:#60a5fa}
.tag.fixed{background:rgba(255,107,53,.12);color:var(--accent)}
.date{font-size:12px;color:var(--text-dim)}
.entry h2{font-size:18px;font-weight:600;margin:0 0 6px;scroll-margin-top:80px}
.entry h2 a.anchor{color:var(--text);text-decoration:none}
.entry h2 a.anchor:hover{color:var(--accent)}
.entry p{font-size:14px;color:var(--text-dim);margin:0}
.state{font-size:14px;color:var(--text-dim);padding:32px 0}
footer{border-top:1px solid var(--border);padding:24px;text-align:center;font-size:12px;color:var(--text-dim)}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <svg width="32" height="32" viewBox="0 0 64 64" fill="none" aria-label="WyvStudio logo"><rect width="64" height="64" rx="14" fill="#ff6b35"/><path d="M14 18 L22 46 L32 28 L42 46 L50 18" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span><em>Wyv</em>Studio</span>
  </a>
</nav>

<div class="container">
  <h1>Changelog</h1>
  <div class="meta">New features, improvements, and fixes — newest first.</div>

  <div id="entries"><div class="state">Loading…</div></div>
</div>

<footer>© 2026 Kollignton Kay Technologies Limited · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/help">Help</a> · <a href="/refund">Refund Policy</a> · <a href="mailto:hello@wyvstudio.com">hello@wyvstudio.com</a></footer>

<script>
// Same-origin: nginx proxies this path to the API (see nginx-marketing/default.conf),
// so no CORS is involved.
(function () {
  var host = document.getElementById('entries');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(d) {
    if (!d) return '';
    var parsed = new Date(d + 'T00:00:00');
    if (isNaN(parsed)) return esc(d);
    return parsed.toLocaleDateString('en', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  fetch('/api/v1/public/changelog', { headers: { Accept: 'application/json' } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (json) {
      var entries = (json && json.data && json.data.entries) || [];
      if (!entries.length) {
        host.innerHTML = '<div class="state">Nothing here yet.</div>';
        return;
      }
      host.innerHTML = entries.map(function (e) {
        var slug = esc(e.slug);
        return '<article class="entry" id="' + slug + '">'
          + '<div class="entry-meta">'
          + '<span class="tag ' + esc(e.tag) + '">' + esc(e.tag) + '</span>'
          + '<span class="date">' + fmtDate(e.date) + '</span>'
          + '</div>'
          + '<h2><a class="anchor" href="#' + slug + '">' + esc(e.title) + '</a></h2>'
          + '<p>' + esc(e.body) + '</p>'
          + '</article>';
      }).join('');
      // Honour a deep link now that the entries exist.
      if (location.hash) {
        var target = document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView();
      }
    })
    .catch(function () {
      host.innerHTML = '<div class="state">Couldn\'t load the changelog right now. '
        + 'Please <a href="/changelog">try again</a>, or email '
        + '<a href="mailto:hello@wyvstudio.com">hello@wyvstudio.com</a>.</div>';
    });
})();
</script>
<script src="/posthog-init.js" defer></script><script src="/cookie-notice.js" defer></script><script src="/crisp-chat.js" defer></script></body>
</html>
