name: Deploy to production

# Auto-deploy on every push to master. Also runnable on demand from the
# Actions tab (workflow_dispatch). Mirrors the server's post-receive hook,
# so a manual `git push prod master` still works as a fallback.
on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. Don't cancel an in-flight deploy mid-build — queue
# the next one behind it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          # docker build + migrate can run several minutes; default 10m is tight.
          command_timeout: 30m
          # Fail the job if any command fails.
          script_stop: true
          script: |
            set -e
            echo '==> Syncing to origin/master...'
            cd /opt/framecast/app
            # fetch + reset, never `git pull`. The server's checkout is
            # disposable and must simply match origin. A plain pull needs the
            # two histories to converge, so any force-push upstream leaves the
            # box stranded on a commit that no longer exists, failing every
            # subsequent deploy with "Need to specify how to reconcile
            # divergent branches" until someone fixes it by hand.
            # Untracked files are left alone, which is what keeps the .env
            # files on the box safe.
            git fetch origin master

            # Decide how much of the stack this push touches BEFORE moving the
            # checkout, by diffing what the box runs against what it is about
            # to run. A push that only changes the docs site, the marketing
            # site or files nothing serves (product notes, mockups, this
            # workflow) must not rebuild and recreate api, nginx and the
            # workers: that recreation takes the whole product down for tens
            # of seconds and has interrupted customers' generations mid-poll.
            # Anything else, or a re-run of the same commit, takes the full path.
            CHANGED=$(git diff --name-only HEAD origin/master || true)
            MODE=full
            if [ -n "$CHANGED" ]; then
              MODE=light
              while IFS= read -r f; do
                case "$f" in
                  framecast-app/docs/product/*) ;;                       # internal notes, nothing serves them
                  framecast-app/docs/*) NEED_DOCS=1 ;;                   # Docusaurus site container
                  framecast-app/marketing/*) NEED_MARKETING=1 ;;         # bind-mounted static site
                  framecast-app/*) MODE=full ;;                          # app, api, mcp, nginx, compose
                  *) ;;                                                  # repo root: notes, mockups, .github
                esac
              done <<< "$CHANGED"
            fi
            echo "==> Deploy mode: $MODE"
            echo "$CHANGED" | sed 's/^/    /'

            git reset --hard origin/master

            cd /opt/framecast/app/framecast-app

            if [ "$MODE" = "light" ]; then
              if [ "${NEED_DOCS:-0}" = "1" ]; then
                echo '==> Rebuilding the docs site only...'
                docker compose -f docker-compose.prod.yml up -d --build --no-deps docs
              fi
              if [ "${NEED_MARKETING:-0}" = "1" ]; then
                echo '==> Reloading the marketing site only...'
                docker compose -f docker-compose.prod.yml restart marketing
              fi
              echo '==> Health check (light)...'
              for i in $(seq 1 12); do
                API=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: app.wyvstudio.com' http://127.0.0.1/api/v1/health || echo 000)
                WWW=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: wyvstudio.com' http://127.0.0.1/ || echo 000)
                DOCS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: docs.wyvstudio.com' http://127.0.0.1/ || echo 000)
                echo "    attempt $i: api=$API marketing=$WWW docs=$DOCS"
                if [ "$API" = "200" ] && [ "$WWW" = "200" ] && { [ "$DOCS" = "200" ] || [ "$DOCS" = "301" ]; }; then
                  echo "==> Done (light). Deployed at $(date)"
                  exit 0
                fi
                sleep 5
              done
              echo '!!! Light deploy: a site is not serving. Container state:'
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            # Self-heal before deploying. When Docker recreates a container it
            # first renames the old one to `<short-id>_<name>`, then creates the
            # replacement. If anything interrupts that swap the renamed husk is
            # left behind and every LATER deploy dies on a name conflict —
            # images build, containers never recreate, and the failure looks
            # nothing like its cause. Slow SIGTERM handling used to trigger this
            # (fixed via `init: true`), but any interruption can, so clear the
            # husks rather than trusting it never happens again.
            # The pattern only matches Docker's rename form, never a real name.
            echo '==> Clearing stale renamed containers from any interrupted deploy...'
            STALE=$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_framecast-app-' || true)
            if [ -n "$STALE" ]; then
              echo "    found: $STALE"
              echo "$STALE" | xargs -r docker rm -f || true
            else
              echo '    none'
            fi

            # `docker rm -f` returns as soon as the removal is ACCEPTED, not when
            # it has finished. Starting `up` against a container still being torn
            # down fails the whole deploy with "removal of container ... is
            # already in progress", and leaves every service in Created — the
            # site goes down and stays down until someone runs `up` by hand.
            # That is what took production out on 22 and 24 September.
            echo '==> Waiting for removals to finish...'
            for i in $(seq 1 60); do
              LEFT=$(docker ps -a --format '{{.Names}}' | grep -cE '^[0-9a-f]{12}_framecast-app-' || true)
              [ "$LEFT" = "0" ] && { echo "    clear after ${i}s"; break; }
              [ "$i" = "60" ] && echo "    WARNING: $LEFT still present after 60s, continuing anyway"
              sleep 1
            done

            # A removal can still land mid-`up` (a crashed worker being reaped,
            # or a previous run's teardown). One retry after a short settle turns
            # that from an outage into a slower deploy.
            echo '==> Building and restarting containers...'
            if ! docker compose -f docker-compose.prod.yml up --build -d --remove-orphans; then
              echo '==> First attempt failed — settling for 20s and retrying once...'
              sleep 20
              docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_framecast-app-' | xargs -r docker rm -f || true
              sleep 5
              docker compose -f docker-compose.prod.yml up --build -d --remove-orphans
            fi

            # Never exit leaving the site down. If anything above still left a
            # service created-but-not-running, start it before we go on.
            echo '==> Verifying every service is actually running...'
            NOT_RUNNING=$(docker compose -f docker-compose.prod.yml ps --status created --status exited --status paused -q | wc -l)
            if [ "$NOT_RUNNING" != "0" ]; then
              echo "    $NOT_RUNNING service(s) not running — starting them"
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            fi

            # marketing + docs use a stock nginx image with bind-mounted config,
            # so `up` never recreates them and config/content changes (e.g. the
            # 404 page) don't reload on their own. Restart them explicitly.
            echo '==> Reloading marketing + docs nginx (bind-mounted config)...'
            docker compose -f docker-compose.prod.yml restart marketing docs

            # Reclaim disk. Each deploy writes a fresh build-cache layer set and
            # orphans the previous images; nothing prunes them, so they grow
            # without bound. On 2026-08-28 that filled a 96GB disk (75GB of
            # build cache alone) and killed the deploy mid-way. Keep 72h of
            # cache so consecutive deploys still hit it, and drop dangling
            # images — neither touches anything a running container needs.
            echo '==> Reclaiming disk (old build cache + dangling images)...'
            docker builder prune -f --filter until=72h || true
            docker image prune -f || true
            df -h / | tail -1

            echo '==> Running migrations...'
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T api php artisan migrate --force --no-interaction
            # Seeders are idempotent (updateOrCreate) but intentionally NOT run
            # on every deploy. Run them by hand when seed data actually changes:
            #   docker compose -f docker-compose.prod.yml exec api php artisan db:seed --class=NicheSeeder --force

            # A deploy that reports success while the site is down is worse than
            # one that fails: nobody looks. Check the origin directly (not
            # through Cloudflare, which caches and would mask it).
            echo '==> Health check...'
            OK=0
            for i in $(seq 1 30); do
              API=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: app.wyvstudio.com' http://127.0.0.1/api/v1/health || echo 000)
              WWW=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: wyvstudio.com' http://127.0.0.1/ || echo 000)
              echo "    attempt $i: api=$API marketing=$WWW"
              if [ "$API" = "200" ] && [ "$WWW" = "200" ]; then OK=1; break; fi
              sleep 5
            done
            if [ "$OK" != "1" ]; then
              echo '!!! Site is not serving after deploy. Container state:'
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            echo "==> Done. Deployed at $(date)"
