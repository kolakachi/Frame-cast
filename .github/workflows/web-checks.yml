name: Web release checks

on:
  workflow_call:
  pull_request:
    paths:
      - 'framecast-app/web/**'
      - 'framecast-app/nginx/**'
      - 'framecast-app/.dockerignore'
      - '.github/workflows/web-checks.yml'
  push:
    branches: [master]
    paths:
      - 'framecast-app/web/**'
      - 'framecast-app/nginx/**'
      - 'framecast-app/.dockerignore'
      - '.github/workflows/web-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: framecast-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: node --test tests/*.test.mjs
      - run: yarn build
        env:
          VITE_API_URL: ''
          NAPI_RS_ENFORCE_VERSION_CHECK: '1'
